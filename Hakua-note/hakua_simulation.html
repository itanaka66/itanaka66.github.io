<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>白亜のノート - 修正版v13</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; color: #333; background: #f5f5f5; }

.game-container {
  height: 100vh;
  height: 100dvh;
  max-width: 1366px;
  margin: 0 auto;
  padding: 0.6rem 0.8rem;
  display: grid;
  grid-template-columns: 1fr;
  grid-template-rows: auto auto auto auto 1fr;
  grid-template-areas: "banner" "header" "overview" "tabs" "content";
  gap: 0.5rem;
  overflow: hidden;
}
.banner { grid-area: banner; border-radius: 10px; overflow: hidden; line-height: 0; flex-shrink: 0; }
.banner svg { width: 100%; height: clamp(50px, 8vh, 90px); display: block; }

.header { grid-area: header; padding-bottom: 0.4rem; border-bottom: 1px solid #ddd; flex-shrink: 0; }
.title { font-size: clamp(14px, 2vh, 18px); font-weight: 500; margin-bottom: 0.15rem; }
.subtitle { font-size: clamp(11px, 1.6vh, 13px); color: #666; }

.overview { grid-area: overview; overflow-y: auto; min-height: 0; }
.status-row { display: flex; gap: 10px; margin-bottom: 0.6rem; }
.portrait-box { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 6px; text-align: center; flex-shrink: 0; width: clamp(64px, 9vw, 88px); }
.portrait-box svg { width: 100%; height: auto; max-height: 64px; }
.portrait-label { font-size: 10px; color: #999; margin-top: 2px; }
.village-box { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 6px; flex: 1; overflow: hidden; min-width: 0; }
.village-box svg { width: 100%; height: clamp(48px, 7vh, 80px); display: block; }
.village-status { font-size: 11px; color: #666; margin-top: 4px; padding-top: 4px; border-top: 1px solid #eee; }

.location-icon svg { width: 32px; height: 32px; }

.tabs { grid-area: tabs; display: flex; border-bottom: 1px solid #ddd; overflow-x: auto; flex-shrink: 0; }
.tab { padding: 8px 12px; border: none; background: transparent; cursor: pointer; font-size: 13px; color: #999; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab.active { color: #333; border-bottom-color: #378ADD; }

.tab-content { grid-area: content; min-height: 0; overflow: hidden; position: relative; }
.panel { display: none; height: 100%; overflow-y: auto; padding-right: 2px; }
.panel.active { display: block; }

.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 0.6rem; }
.metric { background: white; padding: 8px 10px; border-radius: 8px; border: 1px solid #ddd; }
.metric-label { font-size: 11px; color: #999; margin-bottom: 2px; }
.metric-value { font-size: 16px; font-weight: 500; }
.metric-bar { height: 4px; background: #ddd; border-radius: 2px; margin-top: 4px; overflow: hidden; }
.metric-fill { height: 100%; background: #378ADD; border-radius: 2px; }
.metric-fill.warn { background: #E24B4A; }

.story-box { background: white; padding: 0.7rem; border-radius: 8px; border: 1px solid #ddd; }
.story-text { font-size: 13px; line-height: 1.5; }
.event-log { font-size: 11px; color: #666; margin-top: 6px; padding-top: 6px; border-top: 1px solid #eee; min-height: 14px; }
.dinosaur-alert { background: #FEE8E8; color: #A32D2D; padding: 10px; border-radius: 8px; margin-bottom: 0.6rem; font-size: 12px; border: 1px solid #F09595; }
.dinosaur-alert strong { display: block; margin-bottom: 2px; }

.actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 0.6rem; }
.action-btn { padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; background: white; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 8px; text-align: left; }
.action-btn svg { width: 22px; height: 22px; flex-shrink: 0; }
.action-text { display: flex; flex-direction: column; min-width: 0; }
.action-btn:hover { background: #f9f9f9; }
.action-btn.disabled { opacity: 0.5; cursor: not-allowed; }
.action-name { font-weight: 500; display: block; margin-bottom: 1px; }
.action-cost { font-size: 10px; color: #999; }

.map { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.location { background: white; padding: 8px; border-radius: 8px; border: 1px solid #ddd; cursor: pointer; text-align: center; }
.location:hover { background: #f9f9f9; }
.location-name { font-weight: 500; font-size: 12px; margin-bottom: 2px; }
.location-status { font-size: 10px; color: #999; }
.location.explored { border-color: #378ADD; background: #E6F1FB; }

.tech-tree { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.tech { background: white; padding: 8px 10px; border-radius: 8px; border: 1px solid #ddd; cursor: pointer; }
.tech.unlocked { border-color: #639922; background: #EAF3DE; }
.tech.locked { opacity: 0.6; }
.tech-name { font-weight: 500; font-size: 12px; margin-bottom: 2px; }
.tech-cost { font-size: 10px; color: #999; }
.tech-level { font-size: 11px; margin-top: 2px; }

.save-slot { background: white; padding: 10px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
.save-name { font-weight: 500; font-size: 12px; }
.save-date { font-size: 10px; color: #999; margin-top: 2px; }
.save-slot button { padding: 6px 10px; font-size: 11px; border: 1px solid #ddd; border-radius: 8px; background: white; cursor: pointer; }
textarea { width: 100%; height: 60px; font-size: 11px; border: 1px solid #ddd; border-radius: 8px; padding: 6px; margin-bottom: 6px; }

.controls { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { padding: 8px 14px; border: 1px solid #ddd; border-radius: 8px; background: #378ADD; color: white; cursor: pointer; font-size: 12px; font-weight: 500; }
.btn-secondary { background: white; color: #333; }
.btn-success { background: #639922; color: white; }

.ending-screen { background: white; padding: 1.2rem; border-radius: 12px; border: 1px solid #ddd; text-align: center; }
.ending-title { font-size: 18px; font-weight: 500; margin-bottom: 0.8rem; }
.ending-text { font-size: 13px; line-height: 1.5; margin-bottom: 1rem; color: #666; }

.choice-box { background: #FEE8E8; padding: 0.8rem; border-radius: 8px; margin-bottom: 0.6rem; }
.choice-box p { font-size: 12px; margin-bottom: 8px; color: #A32D2D; }
.choice-btns { display: flex; gap: 8px; }
.choice-btns button { flex: 1; padding: 8px; font-size: 11px; border: 1px solid #ddd; border-radius: 8px; background: white; cursor: pointer; }

/* PC想定 1366x768 相当: 横長画面は2カラムレイアウト */
@media (min-width: 900px) and (min-aspect-ratio: 1/1) {
  .game-container {
    grid-template-columns: 340px 1fr;
    grid-template-rows: auto auto auto 1fr;
    grid-template-areas:
      "banner banner"
      "overview header"
      "overview tabs"
      "overview content";
  }
  .status-row { flex-direction: column; }
  .portrait-box { width: 100%; }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .actions { grid-template-columns: repeat(3, 1fr); }
}

/* スマホ縦画面 1080x1920 相当: 1カラムを縦いっぱいに使う */
@media (max-width: 899px), (max-aspect-ratio: 1/1) {
  .banner svg { height: clamp(40px, 6vh, 70px); }
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .actions { grid-template-columns: repeat(2, 1fr); }
  .map, .tech-tree { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>

const seasons = ['春季','夏季','秋季','冬季'];
const storyLines = [
  '南里桜は集落の仲間たちと共に、白亜紀の大地で新しい文明を築き始めた。',
  '夏が訪れ、集落は成長している。周辺への探検も活発化し始めた。',
  '秋を迎え、冬への準備が急務だ。資源の確保が重要になる。',
  '厳しい冬が訪れた。集落全体で力を合わせてこの季節を乗り切る。',
  '新しい年へ。桜は白亜紀の謎に一歩近づいた。',
  '集落の技術が飛躍的に向上している。新しい可能性が見えてきた。',
  '恐竜との遭遇は避けられない。集落の防衛が課題となってきた。',
  '文明の創造は想像以上に困難だ。しかし諦めてはいられない。'
];
const randomEvents = [
  { text: '豊作の兆し。食料が予想以上に集まった。', effect: { food: 15 } },
  { text: '軽い病が流行したが、大事には至らなかった。', effect: { happiness: -8 } },
  { text: '仲間が珍しい木の実を見つけ、皆が喜んだ。', effect: { happiness: 10 } },
  { text: '嵐が集落を襲い、備蓄の一部が失われた。', effect: { wood: -10, food: -10 } },
  { text: '旅人が知識を分けてくれた。', effect: { techPoints: 3 } }
];

function freshState() {
  return {
    turn: 0, season: 0,
    population: 12, food: 45, wood: 28, stone: 12, techPoints: 5, happiness: 75,
    buildings: { huts: 3, farm: 1, watchtower: 0 },
    technology: { agriculture: 1, hunting: 1, construction: 1, mas: 0, met: 0, def: 0, med: 0, agr2: 0, hun2: 0, irrigation: 0, fortify: 0 },
    dinosaurThreat: 0,
    locations: [
      { id: 0, name: '深い森', icon: ICONS.forest, explored: false, resource: 'wood', amount: 20 },
      { id: 1, name: '川沿い', icon: ICONS.river, explored: false, resource: 'food', amount: 25 },
      { id: 2, name: '石の崖', icon: ICONS.cliff, explored: false, resource: 'stone', amount: 30 },
      { id: 3, name: '古い遺跡', icon: ICONS.ruins, explored: false, resource: 'techPoints', amount: 10 },
      { id: 4, name: '恐竜の谷', icon: ICONS.dino, explored: false, resource: 'danger', danger: 30 },
      { id: 5, name: '鉱脈', icon: ICONS.mine, explored: false, resource: 'stone', amount: 40 }
    ],
    technologies: [
      { id: 'agr2', name: '高度な農業', cost: 11, prereq: 'agriculture' },
      { id: 'hun2', name: '狩猟技術Ⅱ', cost: 9, prereq: 'hunting' },
      { id: 'mas', name: '石造建築', cost: 14, prereq: 'construction' },
      { id: 'met', name: '金属工学', cost: 15, prereq: 'mas' },
      { id: 'med', name: '医療知識', cost: 13, prereq: null },
      { id: 'def', name: '防衛技術', cost: 14, prereq: 'construction' },
      { id: 'irrigation', name: '灌漑技術', cost: 16, prereq: 'agr2' },
      { id: 'fortify', name: '要塞化', cost: 16, prereq: 'def' }
    ],
    story: 0, eventText: '', gameEnded: false
  };
}

let gs = freshState();

const actions = [
  { name: '狩りに出かける', icon: 'hunt', cost: { food: -8 }, gain: { food: 26, wood: 5 }, effect: '食料獲得' },
  { name: '採石に出かける', icon: 'quarry', cost: { food: -8 }, gain: { stone: 10 }, effect: '石材獲得' },
  { name: '農地を拡張', icon: 'farm', cost: { food: -8, wood: -5 }, gain: { population: 1, food: 10 }, effect: '人口と食料が増える' },
  { name: '小屋を建てる', icon: 'hut', cost: { food: -5, wood: -15 }, gain: { population: 2, happiness: 5 }, effect: '移住者増加' },
  { name: '井戸を掘る', icon: 'well', cost: { food: -3, wood: -8, stone: -8 }, gain: { happiness: 15 }, effect: '衛生向上' },
  { name: '医療施設', icon: 'medical', cost: { food: -10, wood: -20 }, gain: { happiness: 20 }, effect: '健康管理' },
  { name: '見張り台を建設', icon: 'tower', cost: { food: -8, wood: -18, stone: -10 }, gain: { watchtower: 1, dinosaurThreat: -15 }, effect: '恒久的な防衛力+1' },
  { name: '木材で交易する', icon: 'trade', cost: { wood: -30 }, gain: { food: 15, happiness: 5 }, effect: '余った木材を資源に変換' },
  { name: '貯蔵庫を建てる', icon: 'storehouse', cost: { wood: -15, stone: -25 }, gain: { happiness: 10, techPoints: 3 }, effect: '余剰資源を有効活用' },
  { name: '集落を休める', icon: 'rest', cost: {}, gain: { happiness: 10 }, effect: '疲労軽減' },
  { name: '祭りを開催', icon: 'festival', cost: { food: -20 }, gain: { happiness: 25, population: 1 }, effect: '結束強化' }
];

function round(n) { return Math.round(n * 10) / 10; }

function getExpression() {
  if (gs.dinosaurThreat > 60) return 'alarmed';
  if (gs.food < 10 || gs.happiness < 30) return 'exhausted';
  if (gs.happiness < 55) return 'worried';
  if (gs.happiness >= 75) return 'happy';
  return 'neutral';
}

function renderVillageScene() {
  const hutCount = Math.min(6, gs.buildings.huts);
  const towerCount = Math.min(3, gs.buildings.watchtower);
  const prosperity = Math.min(1, gs.population / 30);
  const skyColor = gs.dinosaurThreat > 50 ? '#C9A87A' : (prosperity > 0.6 ? '#BFE3F5' : '#E8DCC0');
  const groundColor = prosperity > 0.5 ? '#7FA85C' : '#A69A72';

  let huts = '';
  for (let i = 0; i < hutCount; i++) {
    const x = 20 + i * 42;
    huts += `<path d="M${x} 55 L${x+14} 40 L${x+28} 55 Z" fill="#8A6A4A"/><rect x="${x+6}" y="55" width="16" height="14" fill="#B99B72"/>`;
  }
  let towers = '';
  for (let i = 0; i < towerCount; i++) {
    const x = 300 + i * 26;
    towers += `<rect x="${x}" y="34" width="10" height="35" fill="#7A6A56"/><path d="M${x-2} 34 L${x+5} 24 L${x+12} 34 Z" fill="#5A4A3A"/>`;
  }
  const stormOverlay = gs.dinosaurThreat > 50 ? `<rect x="0" y="0" width="400" height="90" fill="#5A4A3A" opacity="0.18"/>` : '';

  document.getElementById('villageScene').innerHTML = `
    <svg viewBox="0 0 400 90" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width="400" height="90" fill="${skyColor}"/>
      <rect x="0" y="60" width="400" height="30" fill="${groundColor}"/>
      ${huts}
      ${towers}
      ${stormOverlay}
    </svg>`;
}

function getVillageStatusText() {
  const parts = [];

  if (gs.population <= 5) parts.push('人口は危機的に少ない');
  else if (gs.population < 15) parts.push('集落はまだ小さい');
  else if (gs.population < 25) parts.push('集落は着実に育っている');
  else parts.push('集落は大きく繁栄している');

  if (gs.food < 10) parts.push('食料は底をつきかけている');
  else if (gs.food < 25) parts.push('食料はやや心許ない');
  else parts.push('食料は十分に蓄えられている');

  if (gs.dinosaurThreat > 60) parts.push('恐竜の脅威が深刻化している');
  else if (gs.dinosaurThreat > 30) parts.push('恐竜の気配が漂う');

  if (gs.happiness < 30) parts.push('村人たちは疲弊している');
  else if (gs.happiness >= 85) parts.push('村人たちは満ち足りている');

  return parts.join('。') + '。';
}

function updatePortrait() {
  document.getElementById('portrait').innerHTML = FACES[getExpression()];
}

function updateUI() {
  const year = Math.floor(gs.turn / 4) + 1;
  document.getElementById('mainSubtitle').textContent = `白亜紀 第${year}年 ${seasons[gs.season]}`;
  document.getElementById('population').textContent = Math.max(0, gs.population);
  document.getElementById('food').textContent = round(Math.max(0, gs.food));
  document.getElementById('wood').textContent = round(Math.max(0, gs.wood));
  document.getElementById('stone').textContent = round(Math.max(0, gs.stone));
  document.getElementById('techPoints').textContent = round(gs.techPoints);
  document.getElementById('happiness').textContent = Math.max(0, Math.min(100, Math.round(gs.happiness))) + '%';

  document.getElementById('popBar').style.width = Math.min(100, gs.population * 2) + '%';
  document.getElementById('foodBar').style.width = Math.min(100, gs.food) + '%';
  document.getElementById('foodBar').className = 'metric-fill' + (gs.food < 15 ? ' warn' : '');
  document.getElementById('woodBar').style.width = Math.min(100, gs.wood * 2) + '%';
  document.getElementById('stoneBar').style.width = Math.min(100, gs.stone * 2) + '%';
  document.getElementById('techBar').style.width = Math.min(100, gs.techPoints * 3) + '%';
  document.getElementById('happyBar').style.width = Math.max(0, Math.min(100, gs.happiness)) + '%';
  document.getElementById('happyBar').className = 'metric-fill' + (gs.happiness < 30 ? ' warn' : '');

  if (gs.dinosaurThreat > 40) {
    document.getElementById('dinosaurAlert').style.display = 'block';
    document.getElementById('dinosaurAlert').innerHTML = `<div style="display:flex;align-items:center;gap:10px;"><span style="width:28px;height:28px;flex-shrink:0;">${ICONS.dino}</span><span><strong>恐竜の脅威</strong>危険度: ${Math.round(gs.dinosaurThreat)}%。見張り台の建設を検討しよう。</span></div>`;
  } else {
    document.getElementById('dinosaurAlert').style.display = 'none';
  }

  document.getElementById('storyText').textContent = storyLines[Math.min(gs.story, storyLines.length - 1)];
  document.getElementById('eventLog').textContent = gs.eventText;

  renderActions();
  renderMap();
  renderTech();
  updatePortrait();
  renderVillageScene();
  document.getElementById('villageStatus').textContent = getVillageStatusText();
  checkEnding();
}

function renderActions() {
  const c = document.getElementById('actionsContainer');
  c.innerHTML = '';
  actions.forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'action-btn';
    const canAfford = Object.entries(a.cost).every(([r, v]) => gs[r] >= -v);
    if (!canAfford) btn.classList.add('disabled');
    btn.innerHTML = `${ICONS[a.icon]}<span class="action-text"><span class="action-name">${a.name}</span><span class="action-cost">${a.effect}</span></span>`;
    btn.onclick = () => canAfford && performAction(a);
    c.appendChild(btn);
  });
}

function performAction(a) {
  Object.entries(a.cost).forEach(([r, v]) => gs[r] += v);
  Object.entries(a.gain).forEach(([r, v]) => {
    if (r === 'watchtower') gs.buildings.watchtower += v;
    else gs[r] += v;
  });
  gs.happiness = Math.max(0, Math.min(100, gs.happiness));
  gs.population = Math.max(1, gs.population);
  gs.food = Math.max(0, gs.food);
  gs.dinosaurThreat = Math.max(0, gs.dinosaurThreat);
  gs.story = Math.min(storyLines.length - 1, gs.story + 1);
  nextTurn();
}

function renderMap() {
  const c = document.getElementById('mapContainer');
  c.innerHTML = '';
  gs.locations.forEach(loc => {
    const div = document.createElement('div');
    div.className = 'location' + (loc.explored ? ' explored' : '');
    div.innerHTML = `<div class="location-icon">${loc.icon}</div><div class="location-name">${loc.name}</div><div class="location-status">${loc.explored ? '探検済み' : '未探検'}</div>`;
    div.onclick = () => exploreLocation(loc);
    c.appendChild(div);
  });
}

function exploreLocation(loc) {
  if (loc.explored) return;
  if (loc.resource === 'danger') {
    showChoice(loc);
    return;
  }
  loc.explored = true;
  gs[loc.resource] += loc.amount;
  gs.techPoints += 2;
  gs.story = Math.min(storyLines.length - 1, gs.story + 1);
  updateUI();
}

function showChoice(loc) {
  document.getElementById('choiceBox').style.display = 'block';
  document.getElementById('choiceBox').innerHTML = `
    <div class="choice-box">
      <p>${loc.name}で恐竜に遭遇した。どうする？</p>
      <div class="choice-btns">
        <button id="fightBtn">戦う（見張り台があれば有利）</button>
        <button id="retreatBtn">撤退する</button>
      </div>
    </div>
  `;
  document.getElementById('fightBtn').onclick = () => {
    const winChance = 0.4 + gs.buildings.watchtower * 0.15;
    if (Math.random() < winChance) {
      gs.techPoints += 6;
      gs.eventText = `${loc.name}での戦いに勝利し、貴重な資源を得た。`;
    } else {
      gs.population = Math.max(1, gs.population - 2);
      gs.happiness -= 15;
      gs.eventText = `${loc.name}での戦いに敗れ、仲間を失った。`;
    }
    loc.explored = true;
    document.getElementById('choiceBox').style.display = 'none';
    updateUI();
  };
  document.getElementById('retreatBtn').onclick = () => {
    gs.eventText = `${loc.name}から静かに撤退した。`;
    document.getElementById('choiceBox').style.display = 'none';
    updateUI();
  };
}

function renderTech() {
  const c = document.getElementById('techContainer');
  c.innerHTML = '';
  gs.technologies.forEach(t => {
    const div = document.createElement('div');
    const already = gs.technology[t.id] > 0;
    const affordable = gs.techPoints >= t.cost && (!t.prereq || gs.technology[t.prereq] > 0);
    div.className = 'tech' + (already ? ' unlocked' : affordable ? '' : ' locked');
    div.innerHTML = `<div class="tech-name">${t.name}</div><div class="tech-cost">必要技術点: ${t.cost}</div><div class="tech-level">${already ? '研究済み' : affordable ? '研究可能' : '未解禁'}</div>`;
    div.onclick = () => !already && affordable && researchTech(t);
    c.appendChild(div);
  });
}

function researchTech(t) {
  gs.techPoints -= t.cost;
  gs.technology[t.id] = 1;
  gs.happiness += 5;
  if (t.id === 'def') gs.buildings.watchtower += 1;
  updateUI();
}

function nextTurn() {
  if (gs.gameEnded) return;
  gs.turn++;
  gs.season = gs.turn % 4;

  const consumption = Math.ceil(gs.population * 2);
  const farmYield = gs.buildings.farm * 6 * (1 + gs.technology.agriculture * 0.5 + gs.technology.agr2 + (gs.technology.irrigation ? 0.5 : 0));
  const huntYield = gs.technology.hun2 ? 4 : 0;
  gs.food += farmYield + huntYield - consumption;

  if (gs.food < 0) {
    gs.happiness -= 15;
    gs.population = Math.max(1, Math.floor(gs.population * 0.85));
    gs.food = 0;
  } else {
    gs.happiness = Math.min(100, gs.happiness + 1);
  }

  gs.wood += gs.buildings.huts * 2;
  gs.stone += gs.buildings.watchtower * 0.5;
  const fortifyBonus = gs.technology.fortify ? 3 : 0;
  gs.dinosaurThreat = Math.max(0, gs.dinosaurThreat - gs.buildings.watchtower * (5 + fortifyBonus));
  if (gs.season === 3) gs.dinosaurThreat = Math.min(100, gs.dinosaurThreat + 12);
  else if (gs.turn % 8 === 0) gs.dinosaurThreat = Math.min(100, gs.dinosaurThreat + 6);
  gs.techPoints += 1 + (gs.technology.med ? 1 : 0);

  gs.eventText = '';
  if (Math.random() < 0.35) {
    const ev = randomEvents[Math.floor(Math.random() * randomEvents.length)];
    Object.entries(ev.effect).forEach(([r, v]) => gs[r] += v);
    gs.eventText = ev.text;
  }

  gs.food = Math.max(0, gs.food);
  gs.happiness = Math.max(0, Math.min(100, gs.happiness));
  gs.story = Math.min(storyLines.length - 1, gs.story + 1);

  updateUI();
}

function checkEnding() {
  if (gs.gameEnded) return;
  const year = Math.floor(gs.turn / 4) + 1;
  if (gs.population <= 0) {
    endGame('集落が滅亡した。文明の夢は終わった。');
  } else if (gs.population >= 25 && year >= 7) {
    endGame('集落は大きく発展し、真の文明へと成長した。');
  } else if (year >= 7 && gs.technology.met && gs.buildings.watchtower >= 2) {
    endGame('技術と防衛により、白亜紀での文明確立に成功した。');
  }
}

function endGame(message) {
  gs.gameEnded = true;
  const screen = document.getElementById('endingScreen');
  screen.innerHTML = `<div class="ending-screen"><div class="ending-title">ゲーム終了</div><div class="ending-text">${message}</div><div style="font-size:13px;color:#666;margin-bottom:1.5rem;">年数: ${Math.floor(gs.turn/4)+1} | 人口: ${gs.population} | 幸福度: ${Math.round(gs.happiness)}%</div><button class="btn" id="restartBtn">新しいゲームを開始</button></div>`;
  screen.style.display = 'block';
  document.getElementById('game').style.display = 'none';
  document.getElementById('restartBtn').onclick = () => { gs = freshState(); screen.style.display = 'none'; document.getElementById('game').style.display = 'block'; updateUI(); };
}

// localStorageがブロックされる環境(file://で開いた場合など)向けのフォールバック
const memoryStore = {};
function safeGetStore() {
  try {
    return JSON.parse(localStorage.getItem('hakuaSavesV13') || '{}');
  } catch (e) {
    return memoryStore.hakuaSavesV13 ? JSON.parse(memoryStore.hakuaSavesV13) : {};
  }
}
function safeSetStore(data) {
  const json = JSON.stringify(data);
  try {
    localStorage.setItem('hakuaSavesV13', json);
  } catch (e) {
    memoryStore.hakuaSavesV13 = json;
  }
}

function saveGame() {
  const name = `セーブ${new Date().toLocaleTimeString('ja-JP')}`;
  const saves = safeGetStore();
  saves[name] = { ...gs, savedAt: new Date().toLocaleString('ja-JP') };
  safeSetStore(saves);
  renderSaves();
}

function renderSaves() {
  const c = document.getElementById('saveSlotsContainer');
  const saves = safeGetStore();
  c.innerHTML = Object.keys(saves).length === 0 ? '<p style="color:#999;font-size:13px;">セーブデータがありません。</p>' : '';
  Object.entries(saves).forEach(([name, data]) => {
    const div = document.createElement('div');
    div.className = 'save-slot';
    div.innerHTML = `<div><div class="save-name">${name}</div><div class="save-date">年:${Math.floor(data.turn/4)+1} 人口:${data.population} ${data.savedAt}</div></div><button id="load-${name}">読込</button>`;
    c.appendChild(div);
    div.querySelector('button').onclick = () => { gs = data; gs.gameEnded = false; document.getElementById('endingScreen').style.display = 'none'; document.getElementById('game').style.display = 'block'; updateUI(); };
  });
}

document.getElementById('resetBtn').onclick = () => { gs = freshState(); document.getElementById('endingScreen').style.display = 'none'; document.getElementById('game').style.display = 'block'; updateUI(); };
document.getElementById('saveBtn').onclick = saveGame;
document.getElementById('exportBtn').onclick = () => { document.getElementById('importArea').value = JSON.stringify(gs); };
document.getElementById('importBtn').onclick = () => {
  try { gs = JSON.parse(document.getElementById('importArea').value); gs.gameEnded = false; updateUI(); }
  catch (e) { alert('データの形式が正しくありません'); }
};

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById(tab.dataset.panel).classList.add('active');
    if (tab.dataset.panel === 'save') renderSaves();
  };
});

updateUI();
</script>
